[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pse-triglav"
version = "0.1.0"
description = "PSE Triglav: agents that measure their theta against their mission; distributed oversight on the PSE framework"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Andrej Ristić" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://www.zeravatech.ca"
Source = "https://github.com/zeravatechnologies/pse-triglav"

[project.scripts]
triglav = "triglav.cli:main"

[tool.setuptools]
packages = ["triglav", "triglav.core", "triglav.shell"]

[tool.setuptools.package-data]
triglav = ["keys/allowed_signers"]
